{% extends "base.html" %}
{% block title %}Connexion — Massey Contracts & Tax{% endblock %}
{% block content %}
<h1>Connexion</h1>
<form method="post" class="card" style="max-width:420px;">
  <div class="form-group">
    <label for="email">Courriel</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button type="submit" class="btn btn-primary">Se connecter</button>
</form>
<p class="helptext">Pas encore de compte ? <a href="{{ url_for('register') }}">Inscrivez-vous</a> ou <a href="{{ url_for('intake') }}">ouvrez un dossier</a>.</p>
{% endblock %}
