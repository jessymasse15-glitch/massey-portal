{% extends "base.html" %}
{% block title %}Mot de passe oublié — Massey Contracts & Tax{% endblock %}
{% block content %}
<h1>Mot de passe oublié</h1>
<p class="helptext" style="max-width:60ch;margin-bottom:16px;">Indiquez le courriel associé à votre compte — nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>
<form method="post" class="card" style="max-width:420px;">
  <div class="form-group">
    <label for="email">Courriel</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary">Envoyer le lien</button>
</form>
<p class="helptext"><a href="{{ url_for('login') }}">← Retour à la connexion</a></p>
{% endblock %}
