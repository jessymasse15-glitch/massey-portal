{# Actions d'un article : Lire l article (principal en liste), PDF, Citer, Partager. Attend : card, has_access ; optionnel : labels (textes visibles). #}
{% set lbl = labels|default(False) %}
<div class="rv-actions{{ ' rv-actions-lg' if lbl }} rv-noprint">
  {% if not lbl %}<a class="rv-btn rv-btn-primary" href="{{ url_for('revue_article_detail', slug=card.a['slug']) }}"
     aria-label="Lire l'article « {{ card.a['title'] }} »"><span>Lire l'article</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>{% endif %}
  <a class="rv-btn{{ ' rv-btn-primary' if lbl }}" href="{{ url_for('revue_article_pdf', slug=card.a['slug']) }}"
     title="{{ 'Télécharger le PDF' if has_access else 'PDF réservé aux abonnés' }}" aria-label="Télécharger le PDF de « {{ card.a['title'] }} »">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6m-3-3 3 3 3-3"/></svg>
    <span>PDF</span></a>
  <details class="rv-more">
    <summary class="rv-btn rv-btn-icon" aria-label="Plus d'actions pour « {{ card.a['title'] }} »" title="Plus d'actions">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      <span class="{{ '' if lbl else 'rv-sr' }}">Plus</span></summary>
    <div class="rv-more-menu">
      <button type="button" data-rv-cite data-title="{{ card.a['title'] }}" data-slug="{{ card.a['slug'] }}"
              data-cite='{{ {"plain": card.cite, "html": card.cite_html}|tojson }}' aria-haspopup="dialog">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h4v4c0 3-2 5-4 5M15 7h4v4c0 3-2 5-4 5"/></svg>Citer cet article</button>
      <button type="button" data-rv-share data-title="{{ card.a['title'] }}" data-url="{{ card.url }}" aria-haspopup="dialog">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Partager</button>
    </div>
  </details>
</div>
